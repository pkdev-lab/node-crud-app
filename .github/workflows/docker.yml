name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  
  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ vars.DOCKER_USERNAME }}/node-crud-app:latest \
          -t ${{ vars.DOCKER_USERNAME }}/node-crud-app:${{ github.sha }} \
          .

      - name: Push Latest
        run: docker push ${{ vars.DOCKER_USERNAME }}/node-crud-app:latest

      - name: Push SHA Tag
        run: docker push ${{ vars.DOCKER_USERNAME }}/node-crud-app:${{ github.sha }}
